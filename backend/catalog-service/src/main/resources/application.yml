spring:
  application:
    name: catalog-service
  datasource:
    # Points at the existing eventtick_db for now. docs/architecture.md
    # §17 describes database-per-service as a future target, not required
    # for the current local setup. Never commit real credentials — these
    # fall back to environment variables with no hardcoded password.
    url: jdbc:postgresql://localhost:5432/eventtick_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    # The schema is fully owned by database/migrations/ (see
    # database/README.md). Hibernate must never auto-generate or alter it.
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8082

# Phase 14 Step 1: service-local health/metrics endpoints. Deliberately not
# management.endpoints.web.exposure.include: "*" — only health and prometheus
# are exposed, so env/beans/configprops/mappings/loggers/heapdump etc. stay
# unavailable. Never routed through the Gateway.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # The "readiness" group only contains readinessState by default (an
      # app-availability marker, unrelated to any dependency) — "db" is
      # added explicitly so PostgreSQL connectivity actually participates in
      # readiness, via Actuator's auto-configured DataSourceHealthIndicator
      # (no custom HealthIndicator code).
      group:
        readiness:
          include: readinessState,db
