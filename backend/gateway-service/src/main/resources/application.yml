spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      # Phase 7.2: CORS for the browser frontend, which now talks to the
      # gateway instead of the services. The gateway answers preflight
      # (OPTIONS) requests itself and adds CORS headers to real responses.
      # Deliberately narrow: only the listed origins (never "*"), only the
      # methods/headers the frontend's API calls use, and no credentials —
      # auth is an "Authorization: Bearer" header, not a cookie, so
      # allowCredentials stays false.
      globalcors:
        cors-configurations:
          '[/api/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
            allowed-methods:
              - GET
              - POST
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
            # Phase 7.4: lets browser JS read the request id on a response
            # (e.g. to show it next to an error). Read-only; it does not let
            # a page *send* extra headers, so allowed-headers is unchanged.
            exposed-headers:
              - X-Request-ID
            allow-credentials: false
            max-age: 3600

      # user-service still has its own CORS config (kept as defense-in-depth),
      # so a proxied response would otherwise carry these headers twice —
      # once added by the gateway, once by user-service — and browsers reject
      # a response with duplicate Access-Control-Allow-Origin values. This
      # keeps the first copy. It only touches those two response headers; it
      # does not change request paths.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # Phase 7.5: bounds how long the gateway will wait on an upstream
      # service (user-service/catalog-service/booking-service), so a
      # request fails fast and predictably instead of hanging forever when
      # a service is down or stuck. This is the single HTTP client Spring
      # Cloud Gateway uses to call every route below, so it applies
      # uniformly to all three — none of the routes override it.
      #
      # connect-timeout: max time to open the TCP connection to the
      # upstream. A refused connection (service down) fails almost
      # instantly regardless; this bounds a connection that instead hangs
      # (e.g. a firewalled/unresponsive host) -> GatewayErrorHandler
      # reports that as 503.
      #
      # response-timeout: max time to wait for the upstream's response
      # once the request has been sent. Conservative for local dev — long
      # enough for a real request (DB write, seat lock, etc.) to finish
      # without being cut off while testing, short enough that a stuck
      # service doesn't leave a caller hanging -> GatewayErrorHandler
      # reports that as 504. Both are env-overridable, never aggressively
      # low "production" values.
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:8s}

      # Phase 7.1: plain path-based routing. No filters on purpose — the
      # backend services already serve these exact /api/... paths, so the
      # original path is forwarded unchanged (no StripPrefix/RewritePath).
      routes:

        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/users/**

        - id: catalog-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/catalog/**

        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/bookings/**

# Phase 7.3: how the gateway validates the JWTs issued by user-service. These
# must match user-service's jwt.secret / jwt.issuer / jwt.audience — same
# environment variable names, so setting JWT_SECRET once (e.g. in the shell
# both services are started from) configures both. The fallbacks after ':'
# are LOCAL-DEV-ONLY placeholders identical to user-service's own, so the two
# agree even when JWT_SECRET is unset; never rely on them outside a laptop.
# The secret must be at least 32 bytes and is used as raw UTF-8 text (not
# base64-decoded), exactly as user-service uses it.
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-before-any-real-deployment-0123456789}
  issuer: ${JWT_ISSUER:eventtick-user-service}
  audience: ${JWT_AUDIENCE:eventtick-clients}

server:
  port: 8080
