spring:
  application:
    name: gateway-service

  # Phase 11: Redis is the shared state for rate limiting — see
  # ratelimit.RateLimitingGlobalFilter. Multiple gateway instances pointed at
  # the same Redis therefore share one limit per key, instead of each
  # instance separately granting its own allowance. Host/port are
  # env-overridable for anything beyond a single local Redis. timeout and
  # connect-timeout are kept short and conservative on purpose: if Redis is
  # down or unreachable, the rate limiter fails open (see RedisRateLimiter's
  # own error handling) rather than blocking requests, so a slow Redis must
  # not also mean a slow gateway — this bounds how long that takes to
  # discover.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:300ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:300ms}

  cloud:
    gateway:
      # Phase 7.2: CORS for the browser frontend, which now talks to the
      # gateway instead of the services. The gateway answers preflight
      # (OPTIONS) requests itself and adds CORS headers to real responses.
      # Deliberately narrow: only the listed origins (never "*"), only the
      # methods/headers the frontend's API calls use, and no credentials —
      # auth is an "Authorization: Bearer" header, not a cookie, so
      # allowCredentials stays false.
      globalcors:
        cors-configurations:
          '[/api/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
            allowed-methods:
              - GET
              - POST
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
            # Phase 7.4: lets browser JS read the request id on a response
            # (e.g. to show it next to an error). Read-only; it does not let
            # a page *send* extra headers, so allowed-headers is unchanged.
            exposed-headers:
              - X-Request-ID
            allow-credentials: false
            max-age: 3600

      # user-service still has its own CORS config (kept as defense-in-depth),
      # so a proxied response would otherwise carry these headers twice —
      # once added by the gateway, once by user-service — and browsers reject
      # a response with duplicate Access-Control-Allow-Origin values. This
      # keeps the first copy. It only touches those two response headers; it
      # does not change request paths.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # Phase 7.5: bounds how long the gateway will wait on an upstream
      # service (user-service/catalog-service/booking-service), so a
      # request fails fast and predictably instead of hanging forever when
      # a service is down or stuck. This is the single HTTP client Spring
      # Cloud Gateway uses to call every route below, so it applies
      # uniformly to all three — none of the routes override it.
      #
      # connect-timeout: max time to open the TCP connection to the
      # upstream. A refused connection (service down) fails almost
      # instantly regardless; this bounds a connection that instead hangs
      # (e.g. a firewalled/unresponsive host) -> GatewayErrorHandler
      # reports that as 503.
      #
      # response-timeout: max time to wait for the upstream's response
      # once the request has been sent. Conservative for local dev — long
      # enough for a real request (DB write, seat lock, etc.) to finish
      # without being cut off while testing, short enough that a stuck
      # service doesn't leave a caller hanging -> GatewayErrorHandler
      # reports that as 504. Both are env-overridable, never aggressively
      # low "production" values.
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:8s}

      # Phase 7.1: plain path-based routing. No filters on purpose — the
      # backend services already serve these exact /api/... paths, so the
      # original path is forwarded unchanged (no StripPrefix/RewritePath).
      routes:

        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/users/**

        - id: catalog-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/catalog/**

        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/bookings/**

# Phase 7.3: how the gateway validates the JWTs issued by user-service. These
# must match user-service's jwt.secret / jwt.issuer / jwt.audience — same
# environment variable names, so setting JWT_SECRET once (e.g. in the shell
# both services are started from) configures both. The fallbacks after ':'
# are LOCAL-DEV-ONLY placeholders identical to user-service's own, so the two
# agree even when JWT_SECRET is unset; never rely on them outside a laptop.
# The secret must be at least 32 bytes and is used as raw UTF-8 text (not
# base64-decoded), exactly as user-service uses it.
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-before-any-real-deployment-0123456789}
  issuer: ${JWT_ISSUER:eventtick-user-service}
  audience: ${JWT_AUDIENCE:eventtick-clients}

# Phase 12: the dynamic rate-limit policy matrix — see
# ratelimit.RateLimitPolicyResolver for exactly how a request resolves to one
# of these. A dedicated namespace, not spring.cloud.gateway.redis-rate-limiter
# (Phase 11's, now retired): that one only holds a single flat policy, with
# no structure for "many named policies". These are illustrative development
# numbers reasoned from the Eventtick use case below — not production-
# certified — and are read once at startup (ratelimit.RateLimitingGlobalFilter
# registers every one of them on the RedisRateLimiter bean up front); changing
# them needs a restart, same as Phase 11. Policy changes through an admin
# API/UI are explicitly out of scope for this phase.
#
# Shape: policies.<CATEGORY>.<TIER>.{replenish-rate,burst-capacity,requested-tokens}
# CATEGORY: AUTH | CATALOG | BOOKING | USER (see RequestCategoryClassifier for
# the path prefixes each one covers). TIER: PUBLIC | FREE | PRO | PREMIUM |
# ADMIN (see UserTier / RateLimitPolicyResolver for how a request resolves to
# one). requested-tokens defaults to 1 (a plain per-request limit) and is
# omitted below since nothing in this matrix needs a different value.
#
# Only the combinations that can actually happen today are listed:
#   - AUTH only has a PUBLIC entry. GatewaySecurityConfig's public chain
#     (POST /api/auth/register|login) never reads the Authorization header at
#     all, so an authenticated request can never reach the AUTH category —
#     FREE/PRO/PREMIUM/ADMIN x AUTH would be unreachable dead configuration.
#     If that ever changes, resolution falls back to `fallback` below rather
#     than failing, but that fallback is deliberately strict.
#   - CATALOG/BOOKING/USER don't have a PUBLIC entry, for the same reason in
#     reverse: those three routes require a valid JWT (deny-by-default), so
#     an unauthenticated caller can never reach them.
#
# Reasoning behind the numbers (replenish-rate = steady requests/second,
# burst-capacity = the most a caller can do in one burst):
#   - AUTH/PUBLIC is the strictest policy of all: login/register are the
#     prime credential-stuffing/brute-force target, and are keyed by IP
#     (RateLimitKeyResolver), which is coarser than a per-user key, so it
#     also protects against one noisy IP affecting nothing else.
#   - CATALOG is read-heavy and cheap (content/venue/show browsing), so it is
#     the most generous category at every tier.
#   - BOOKING is write-heavy and contention-sensitive (seat holds), so it is
#     the strictest authenticated category — generous enough for a normal
#     checkout flow's handful of calls, not for hammering seat locks.
#   - USER (the caller's own account, e.g. /api/users/me) is called rarely
#     per session, so it sits between AUTH and CATALOG.
#   - Across tiers: PRO is roughly 2-2.5x FREE, PREMIUM roughly 2x PRO, and
#     ADMIN is generously high everywhere it applies — for operational/support
#     work, not because admin traffic is exempt from limiting altogether.
eventtick:
  rate-limit:
    policies:
      AUTH:
        PUBLIC: { replenish-rate: 2, burst-capacity: 5 }
      CATALOG:
        FREE: { replenish-rate: 8, burst-capacity: 16 }
        PRO: { replenish-rate: 20, burst-capacity: 40 }
        PREMIUM: { replenish-rate: 40, burst-capacity: 80 }
        ADMIN: { replenish-rate: 100, burst-capacity: 200 }
      BOOKING:
        FREE: { replenish-rate: 4, burst-capacity: 8 }
        PRO: { replenish-rate: 10, burst-capacity: 20 }
        PREMIUM: { replenish-rate: 20, burst-capacity: 40 }
        ADMIN: { replenish-rate: 50, burst-capacity: 100 }
      USER:
        FREE: { replenish-rate: 5, burst-capacity: 10 }
        PRO: { replenish-rate: 10, burst-capacity: 20 }
        PREMIUM: { replenish-rate: 15, burst-capacity: 30 }
        ADMIN: { replenish-rate: 50, burst-capacity: 100 }
    # Used whenever a request's (category, tier) pair is not one of the
    # combinations above — most notably an unrecognized path
    # (RequestCategory.UNKNOWN), but also a defensive catch-all for any gap
    # in the matrix. Deliberately as strict as AUTH/PUBLIC: an unrecognized
    # situation gets the most conservative treatment, never the most
    # generous, and is never left unlimited.
    fallback:
      replenish-rate: 2
      burst-capacity: 5

server:
  port: 8080
